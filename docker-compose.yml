services:
  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "5001:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=5000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped
