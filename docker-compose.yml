services:
  backend:
    image: aasamedchem-backend:latest
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "5001:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped

  frontend:
    image: aasamedchem-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped
