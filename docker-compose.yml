services:
  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: aasamedchem-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aasamedchem-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
