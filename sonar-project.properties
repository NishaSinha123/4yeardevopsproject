# =========================================================================
# SonarQube Configuration - AasaMedChem Full-Stack Application
# =========================================================================

# Project Identification
sonar.projectKey=Aasamedchem
sonar.projectName=AasaMedChem
sonar.projectVersion=1.0.0

# Source Directories
sonar.sources=src,api

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions (exclude build output, libraries, and static assets)
sonar.exclusions=**/node_modules/**,**/dist/**,**/public/**,**/coverage/**,**/*.spec.js,**/*.test.js,**/*.json,**/*.md

# Environment specifics
sonar.javascript.environments=browser,node
