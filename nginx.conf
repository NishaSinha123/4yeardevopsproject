server {
    listen 80;
    server_name localhost;

    # Serve static assets built by Vite
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy /api requests to Express backend
    location /api/ {
        # Docker's embedded DNS server (prevents Nginx from crashing at startup if backend is not running)
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
